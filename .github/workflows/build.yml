name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip git zip unzip wget
          pip install buildozer cython

      - name: Accept Android SDK licenses
        run: |
          # Create SDK directory
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT

          # Download command line tools
          cd $ANDROID_SDK_ROOT
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools tools

          # Accept licenses
          export PATH=$ANDROID_SDK_ROOT/tools/bin:$PATH
          yes | sdkmanager --licenses 2>/dev/null || true

          # Install build-tools, platform-tools, platform
          yes | sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" 2>/dev/null || true

          # Set environment for buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cp -r $ANDROID_SDK_ROOT/* ~/.buildozer/android/platform/android-sdk/

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDAPI=30" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=21" >> $GITHUB_ENV

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCooler-APK
          path: bin/*.apk
